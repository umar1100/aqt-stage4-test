<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Miss Aapa — ط Lesson (proof)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:-apple-system,system-ui,sans-serif; background:#fdf6ec;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         color:#4a3728; }
  #letter { font-size:22vw; line-height:1; color:#0f766e; margin-bottom:2vh; }
  #aapa { width:34vw; height:34vw; max-width:220px; max-height:220px; border-radius:50%;
          background:radial-gradient(circle at 35% 30%, #5eead4, #0d9488 70%);
          display:flex; align-items:center; justify-content:center;
          font-size:16vw; transition:box-shadow .2s, transform .3s; }
  #aapa.glow { box-shadow:0 0 0 6px #fbbf24, 0 0 44px 10px #fbbf24; animation:pulse 1.2s infinite; }
  #aapa.think { transform:rotate(-8deg); box-shadow:0 0 0 4px #c4b5fd, 0 0 24px 4px #c4b5fd; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px #fbbf24, 0 0 60px 16px #fbbf24; } }
  #status { margin-top:3vh; font-size:5vw; text-align:center; min-height:8vw; padding:0 6vw; }
  #start { margin-top:3vh; font-size:6vw; padding:3vw 10vw; border-radius:999px; border:none;
           background:#0d9488; color:#fff; }
  #dbg { position:fixed; bottom:2vh; font-size:3.4vw; color:#a8a29e; text-align:center; width:100%; }
</style>
</head>
<body>
<div id="letter">ط</div>
<div id="aapa">🧕</div>
<div id="status">Tap Start to begin the ط lesson!</div>
<button id="start">Start</button>
<div id="dbg"></div>
<button id="copylog" style="position:fixed;top:2vh;right:3vw;font-size:3.6vw;padding:1.5vw 3vw;border-radius:999px;border:1px solid #d6c7b4;background:#fff;color:#8a7a66;opacity:.85;">📋 Copy log</button>
<script>
"use strict";
// ---- config ----
const RELAY = new URLSearchParams(location.search).get("relay")
  || "https://aqt-relay-erdph4b2asewbegg.canadacentral-01.azurewebsites.net";
const REF = "طيارة";
const PASS = 85;                 // >=85 correct (provisional, needs calibration)
const GRAY = 75;                 // 75-84 gray: practice again
const THRESH_DB = -28;           // speech-start threshold (Stage 1 iPhone)
const GATE_FRAMES = 3;           // sustained-speech gate: 3 x 10ms frames
const GATE_TICK_MS = 10;
const END_SILENCE_MS = 800;      // utterance end = 800ms below threshold
const LISTEN_TIMEOUT_MS = 25000; // hard timeout on every listen
const SCORE_TIMEOUT_MS = 25000;  // hard timeout on every score
const LINES = {
  greet:"audio/greet.mp3", model:"audio/model_tah.mp3", ack:"audio/ack.mp3",
  prompt:"audio/prompt_word.mp3", praise:"audio/praise.mp3",
  retry:"audio/retry.mp3", almost:"audio/almost.mp3",
  not_heard:"audio/not_heard.mp3", complete:"audio/complete.mp3",
  barge:"audio/barge.mp3",
};
// ---- state ----
let AC=null, analyser=null, micStream=null, tbuf=null;
let speaking=false, lastVoiceT=0, consecAbove=0;
let mode="idle";            // idle|miss_speaking|listen|scoring|done
let phase="isolated";       // isolated|word — which listen we are in
let successes=0, listenTimer=0, rec=null, chunks=[];
let turn=0;                 // generation guard against stale score callbacks
let scoreCtrl=null;
let speechStartT=0;
const $=id=>document.getElementById(id);
const aapa=$("aapa"), statusEl=$("status"), dbg=$("dbg");
const player=new Audio(); player.preload="auto";
// ---- diagnostic log (proof only): one tap copies the whole test trace ----
const t0=performance.now();
const LOG=[];
function logEv(name, data){
  LOG.push(Object.assign({t:+((performance.now()-t0)/1000).toFixed(2), ev:name}, data||{}));
}
function logText(){
  const lines=["MISS AAPA TAH LESSON LOG", new Date().toISOString(), ""];
  for(const e of LOG){
    const rest=Object.keys(e).filter(k=>k!=="t"&&k!=="ev")
      .map(k=>k+"="+e[k]).join(" ");
    lines.push("+"+e.t+"s "+e.ev+(rest?" "+rest:""));
  }
  const scores=LOG.filter(e=>e.ev==="score_result"&&typeof e.accuracy==="number").map(e=>Math.round(e.accuracy));
  lines.push("", "summary: scores=["+scores.join(",")+"]"+
    " barges="+LOG.filter(e=>e.ev==="barge").length+
    " timeouts="+LOG.filter(e=>e.ev==="listen_timeout"||e.ev==="score_timeout").length+
    " not_heard="+LOG.filter(e=>e.ev==="play"&&e.line==="not_heard").length);
  return lines.join("\n");
}

function setStatus(t){ statusEl.textContent=t; }
function setDbg(t){ dbg.textContent=t; }
function glow(on){ aapa.classList.toggle("glow",on); }
function think(on){ aapa.classList.toggle("think",on); }

function playLine(name, then){
  // A line interrupted by barge-in (turn++) must not run its continuation:
  // stale then() calls are the "model played while listening" bug.
  const myTurn=turn;
  const cont=()=>{ if(turn===myTurn && then) then(); };
  try{player.pause();}catch(e){}
  mode="miss_speaking";
  think(false); glow(false);
  logEv("play", {line:name});
  player.src=LINES[name];
  player.onended=()=>{ logEv("play_end", {line:name}); cont(); };
  player.onerror=()=>{ logEv("play_error", {line:name, err:"element_error"}); cont(); };
  const pr=player.play();
  if(pr && pr.catch) pr.catch(e=>{ logEv("play_error", {line:name, err:(e&&e.name)||"rejected"}); cont(); });
}
// iOS Safari only allows audio playback inside a user gesture. Unlock the
// single Audio element synchronously in the Start tap; later plays then work.
function unlockAudio(){
  try{
    player.src=LINES.greet;
    const pr=player.play();
    if(pr && pr.then) pr.then(()=>{ try{player.pause(); player.currentTime=0;}catch(e){} })
                              .catch(()=>{});
    logEv("audio_unlock_attempt");
  }catch(e){ logEv("audio_unlock_error", {err:String(e)}); }
}

function dbfs(){
  analyser.getFloatTimeDomainData(tbuf);
  let s=0; for(let i=0;i<tbuf.length;i++) s+=tbuf[i]*tbuf[i];
  const r=Math.sqrt(s/tbuf.length);
  return r>0 ? 20*Math.log10(r) : -100;
}
function vadTick(){
  const db=dbfs(), now=performance.now();
  if(db>THRESH_DB){
    lastVoiceT=now; consecAbove++;
    // sustained-speech gate (Stage 1): 3 consecutive frames before declaring
    if(!speaking && consecAbove>=GATE_FRAMES){ speaking=true; onSpeechStart(); }
  } else {
    consecAbove=0;
    if(speaking && now-lastVoiceT>END_SILENCE_MS){ speaking=false; onSpeechEnd(); }
  }
}
function onSpeechStart(){
  // Teams-like barge-in: child voice stops Miss Aapa instantly, even mid-ack
  // or while a score is still pending. Never respond to the stale turn.
  speechStartT=speechStartT||performance.now();
  if(mode==="miss_speaking" || mode==="scoring"){
    turn++;
    logEv("barge", {during:mode});
    if(scoreCtrl){ try{scoreCtrl.abort();}catch(e){} scoreCtrl=null; }
    clearTimeout(listenTimer);
    playLine("barge", ()=>goListen(phase));
  } else if(mode==="listen"){
    logEv("speech_start", {phase:phase});
  }
}
function onSpeechEnd(){
  if(mode!=="listen") return;
  clearTimeout(listenTimer);
  const myTurn=turn, myPhase=phase;
  const durMs=speechStartT?Math.round(performance.now()-speechStartT):-1;
  speechStartT=0;
  logEv("speech_end", {phase:myPhase, speechMs:durMs});
  const finish=()=>{ const blob=new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/mp4"});
                     if(myPhase==="isolated") onIsolatedAttempt(myTurn);
                     else scoreUtterance(blob,myTurn); };
  if(rec && rec.state!=="inactive"){ rec.onstop=finish; try{rec.stop();}catch(e){ finish(); } }
  else finish();
}
function onIsolatedAttempt(myTurn){
  // The isolated ط is accepted on genuine sustained speech — never scored
  // (bare-letter scoring is unreliable). Acknowledge immediately, honestly:
  // this claims she heard the try, not that it was correct.
  playLine("ack", ()=>{ if(turn!==myTurn) return;
    playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); }); });
}
async function scoreUtterance(blob, myTurn){
  mode="scoring"; think(true); glow(false); setStatus("Hmm…");
  // immediate acknowledgment of the genuine attempt; verdict follows the score
  scoreCtrl=new AbortController();
  const scoreT0=performance.now();
  logEv("score_request");
  const to=setTimeout(()=>{ try{scoreCtrl.abort();}catch(e){} }, SCORE_TIMEOUT_MS);
  try{
    const r=await fetch(RELAY+"/score?ref="+encodeURIComponent(REF),
      {method:"POST", body:blob, signal:scoreCtrl.signal});
    clearTimeout(to); scoreCtrl=null;
    if(myTurn!==turn || mode!=="scoring") return;  // stale: child barged in
    const d=await r.json();
    think(false);
    logEv("score_result", {accuracy:typeof d.accuracy==="number"?Math.round(d.accuracy):d.error||"bad",
      text:d.text||"", ms:Math.round(performance.now()-scoreT0)});
    if(d.error || typeof d.accuracy!=="number"){
      setDbg("score: "+(d.error||"bad_response"));
      playLine("not_heard", ()=>{ if(turn===myTurn)
        playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); }); });
      return;
    }
    setDbg("heard: "+(d.text||"?")+" — score "+Math.round(d.accuracy));
    if(d.accuracy>=PASS){
      successes++;
      playLine("praise", ()=>{ if(turn!==myTurn) return;
        if(successes>=2){ playLine("complete", ()=>{ if(turn===myTurn){
          logEv("lesson_complete", {successes:successes});
          mode="done"; glow(false); setStatus("Mashallah! Done!"); } }); }
        else playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); });
      });
    } else if(d.accuracy>=GRAY){
      playLine("almost", ()=>{ if(turn===myTurn)
        playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); }); });
    } else {
      playLine("retry", ()=>{ if(turn===myTurn)
        playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); }); });
    }
  }catch(e){ clearTimeout(to); scoreCtrl=null;
    if(myTurn!==turn || mode!=="scoring") return;
    logEv("score_timeout", {ms:SCORE_TIMEOUT_MS});
    think(false); setDbg("score: timeout");
    playLine("not_heard", ()=>{ if(turn===myTurn)
      playLine("prompt", ()=>{ if(turn===myTurn) goListen("word"); }); });
  }
}
function goListen(which){
  // A new listen always invalidates any in-flight score first.
  turn++;
  if(scoreCtrl){ try{scoreCtrl.abort();}catch(e){} scoreCtrl=null; }
  phase=which; mode="listen"; glow(true); think(false);
  logEv("listen_start", {phase:which});
  setStatus(which==="isolated" ? "Your turn — say ط!" : "Your turn! Say طيارة");
  chunks=[];
  try{
    rec=new MediaRecorder(micStream);
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.start(250);
  }catch(e){ setDbg("recorder: "+e); }
  clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{
    if(mode!=="listen") return;
    logEv("listen_timeout", {phase:which});
    if(which==="isolated") playLine("model", ()=>goListen("isolated"));
    else playLine("not_heard", ()=>playLine("prompt", ()=>goListen("word")));
  }, LISTEN_TIMEOUT_MS);
}
async function start(){
  unlockAudio();  // must run synchronously inside the tap gesture (iOS)
  $("start").style.display="none";
  logEv("test_start");
  setStatus("Getting the mic ready…");
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") await AC.resume();
    const src=AC.createMediaStreamSource(micStream);
    analyser=AC.createAnalyser(); analyser.fftSize=2048;
    tbuf=new Float32Array(analyser.fftSize);
    src.connect(analyser);
    lastVoiceT=performance.now();
    setInterval(vadTick, GATE_TICK_MS);
  }catch(e){ setStatus("Mic blocked — allow the microphone and reload."); return; }
  playLine("greet", ()=>playLine("model", ()=>goListen("isolated")));
}
$("start").addEventListener("click", start);
$("copylog").addEventListener("click", async ()=>{
  const txt=logText();
  try{ await navigator.clipboard.writeText(txt); setDbg("log copied ✓ ("+LOG.length+" events)"); }
  catch(e){ setDbg("copy failed — long-press to select"); }
});
</script>
</body>
</html>
